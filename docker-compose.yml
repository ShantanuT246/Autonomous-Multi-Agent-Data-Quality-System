version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: adq_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=autonomous_data_quality

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adq_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=autonomous_data_quality
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-pro}
      - OUTPUT_DIR=reports
      - STORAGE_DIR=backend/storage
    volumes:
      - ./reports:/app/reports
      - ./backend/storage:/app/backend/storage
    depends_on:
      - mongodb

volumes:
  mongo_data:
